name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish clients/windows/PresetKey.Installer/PresetKey.Installer.csproj -c Release
      - run: choco install innosetup --no-progress -y
      - run: iscc clients/windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PresetKey-Windows
          path: artifacts/*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x clients/macos/build-pkg.sh clients/macos/PresetKey.app/Contents/MacOS/PresetKey
      - run: clients/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PresetKey-macOS
          path: artifacts/*.pkg
